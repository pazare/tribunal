name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build
      - run: npm run smoke --workspace @tribunal/web
      # Every committed ledger must verify AND match its published anchor —
      # anchor drift (rewrite or forgotten re-anchor) fails the build.
      - run: npx tsx scripts/check_anchors.ts
